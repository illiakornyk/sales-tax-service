services:
  db:
    image: postgres:16-alpine
    container_name: tax_service_db
    restart: always
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tax_service_pgadmin
    restart: always
    environment:
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_DEFAULT_EMAIL: ${DB_USER}@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5050:80'
    depends_on:
      - db
